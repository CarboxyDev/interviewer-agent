services:
  interviewer:
    build:
      context: .
    init: true
    env_file:
      - .env
    environment:
      INTERVIEWER_DATA_DIR: /app/data
      INTERVIEWER_DATABASE_URL: sqlite+aiosqlite:////app/data/interviewer.db
      INTERVIEWER_HOST: 0.0.0.0
      INTERVIEWER_HEADLESS: "false"
      INTERVIEWER_BROWSER_PROFILE_DIR: /app/data/browser-profile
      INTERVIEWER_BROWSER_CONNECTION_MODE: cdp
      INTERVIEWER_BROWSER_DESKTOP: "true"
      INTERVIEWER_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    ports:
      - "127.0.0.1:${INTERVIEWER_API_PORT:-8000}:8000"
      - "127.0.0.1:${INTERVIEWER_BROWSER_DESKTOP_PORT:-6080}:6080"
    volumes:
      - ./data:/app/data
      - ./input:/input:ro
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
